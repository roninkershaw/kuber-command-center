<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Kuber Command Center</title>
  <style>
    body {
      font-family: -apple-system, Segoe UI, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      margin: 0;
      padding: 40px;
    }
    h1 { color: #38bdf8; margin-top: 0; }
    .card {
      background: #1e293b;
      padding: 20px;
      border-radius: 8px;
      margin: 20px 0;
    }
    .status { color: #22c55e; font-size: 18px; }
  </style>
</head>
<body>
  <h1>Kuber Command Center</h1>

  <div class="card">
    <h2>Status</h2>
    <p class="status">🟢 App is running. No agents active yet.</p>
  </div>

  <div class="card">
    <h2>Version</h2>
    <p>v1.0.0 — Skeleton build</p>
  </div>
</body>
</html>
